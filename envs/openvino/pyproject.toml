[project]
name = "onecomp-gptq-openvino-converter"
version = "2026.3.0.1"
description = "Isolated OpenVINO conversion environment for OneCompression GPTQ models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # OpenVINO / Optimum Intel
  "openvino==2026.3.1",
  "openvino-genai==2026.3.1.0",
  "openvino-tokenizers[transformers]==2026.3.1.0",
  "optimum-intel[openvino]==2.1.0",

  # Hugging Face / conversion runtime
  "transformers==5.5.0",
  "accelerate==1.14.0",
  "sentencepiece==0.2.2",
  "protobuf==7.36.0",

  # Keep HF compatibility packages such as safetensors and huggingface-hub
  # resolver-managed. optimum-intel constrains them, and uv.lock records the
  # exact compatible versions used by this export environment.

  # PyTorch CUDA 13.0
  "torch==2.13.0",
  "torchvision==0.28.0",
  "torchaudio==2.11.0",
  "torchao==0.18.0",

  # OneComp GPTQ checkpoint loading
  "gptqmodel==7.0.0",

  # Workflow pins for reproducibility
  "numpy==2.2.6",
  "kernels==0.12.3",
]

# Keep this environment package-less so installing root onecomp does not pull it in.
# Dependency resolution should treat onecomp and this package as fully independent.
[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
