[project]
name = "onecomp-app-backend"
version = "0.1.0"
description = "Web backend for OneCompression quantization service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "celery[redis]>=5.4",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "onecomp",
    "torch",
    "setproctitle>=1.3,<2",
    "vllm>=0.21.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "httpx"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
onecomp = { path = "../../", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 99
